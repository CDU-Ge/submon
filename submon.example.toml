# submon configuration.
# Copy to ~/.config/submon/config.toml and edit.
#
# 推荐用 `submon login` 交互式写入凭据(自动加密);本文件只手编非凭据部分。
# Token 必须保持 enc:v1:... 密文形态,`submon config --write` 会把明文自动加密。
# 旧格式([zhipu] token + [[zhipu.keys]])会在 Load 时内存迁移到 [[accounts]],
# 任何一次保存都会把文件落成新 schema。

# ── 账号凭据 ──
# 每个 [[accounts]] 是一套凭据;同 provider 多个 label = 多账号(主备/轮换)。
# label 省略或空 → 第一个未命名账号即 default,其余自动编号 key-N。
# base_url 可选:zhipu / kimi 是 provider 基址,gotify 是服务地址(必填)。
# 环境变量优先于 default 账号:ANTHROPIC_AUTH_TOKEN / ANTHROPIC_BASE_URL、
# MINIMAX_TOKEN、OPENCODE_API_KEY、KIMI_CODING_API_KEY / KIMI_API_KEY。
#
# [[accounts]]
# provider = "zhipu"
# label = "default"
# token = "enc:v1:..."
# base_url = "https://open.bigmodel.cn/api/anthropic"
#
# [[accounts]]
# provider = "zhipu"
# label = "alice"
# token = "enc:v1:..."
#
# [[accounts]]
# provider = "minimax"
# label = "default"
# token = "enc:v1:..."
#
# [[accounts]]
# provider = "opencode"
# label = "default"
# token = "enc:v1:..."
#
# [[accounts]]
# provider = "kimi"
# label = "default"
# token = "enc:v1:..."
#
# [[accounts]]
# provider = "gotify"
# label = "default"
# token = "enc:v1:..."                    # app_token
# base_url = "https://gotify.example.com"

[cache]
# Seconds a snapshot stays fresh. statusline reads the cache only; a systemd
# timer running `submon watch` keeps it warm.
ttl_seconds = 300
# path = "/home/you/.cache/submon/cache.json"

[notify]
# 状态栏染色阈值(剩余百分比):低于 warn 变黄、低于 crit 变红。
warn_below_pct = 20.0
crit_below_pct = 5.0

# 催用提醒:窗口将在该时长内重置时开始评估预测浪费,推送「抓紧使用」。
# 设为 0 关闭。例:"1h" = 重置前 1 小时提醒;"30m" = 前 30 分钟。
remind_before = "1h"
# 按当前速率外推,预计浪费 ≥ waste_notify_pct → 普通提醒,≥ waste_urgent_pct → 紧急提醒。
waste_notify_pct = 30.0
waste_urgent_pct = 60.0

[notify.gotify]
# 通知凭据在 [[accounts]] 里(provider = "gotify"),这里只配推送行为。
# 1-10,默认 5;紧急提醒自动 +3(上限 10)。
priority = 5

[statusline]
# 排版方案:a|b|c,详见 README。也可用环境变量 SUBMON_LAYOUT 临时切换。
#   a = ➜ dir git:(main)✗ Model [ctx] 5h 72% left·1h9m weekly 74% left (↻2m)
#   b = Model · ctx 15% used · dir · ⎇main · 5h 72% left (1h9m) · weekly 74% left (5d10h)
#   c = dir main · 15% · 72%/74% (↻2m)
layout = "a"

# statusline provider 选择:
#   仅 $ANTHROPIC_BASE_URL 自动识别(走各 provider 在自己文件里声明的规则)
# 未命中 → statusline 不显示配额段。
#
# 想看非当前会话的 provider:`submon status kimi` / `submon status opencode`
#
# 内建规则不足以覆盖你的私有代理?改 provider 包里对应文件(zhipu.go /
# minimax.go / opencode.go / kimi.go)的 xxxRules(),不是 config.toml。
