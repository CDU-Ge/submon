# submon configuration.
# Copy to ~/.config/submon/config.toml and edit.
# Every field is optional — zhipu also reads ANTHROPIC_BASE_URL /
# ANTHROPIC_AUTH_TOKEN from the environment; minimax falls back to
# ~/.minimax-config.json.

[zhipu]
# Defaults to $ANTHROPIC_BASE_URL. Only the origin matters:
# https://open.bigmodel.cn/api/anthropic and https://api.z.ai/api/anthropic
# are both fine.
base_url = "https://open.bigmodel.cn/api/anthropic"
# Defaults to $ANTHROPIC_AUTH_TOKEN.
# token = "sk-..."

[minimax]
# Also readable from the MINIMAX_TOKEN environment variable.
# `submon generate config` migrates this from ~/.minimax-config.json if that
# file exists.
# token = "eyJ..."

[opencode]
# Also readable from the OPENCODE_API_KEY environment variable.
# token = "oc_..."

[kimi]
# Kimi Coding Plan (https://api.kimi.com/coding/v1). 推荐用 `submon auth kimi` 配置;
# 直接编辑本文件需要手动 encrypt(参考其它 provider 行的 enc:v1:... 形态)。
# `KIMI_CODING_API_KEY` / `KIMI_API_KEY` 环境变量也会被读取。

[cache]
# Seconds a snapshot stays fresh. statusline reads the cache only; a systemd
# timer running `submon watch` keeps it warm.
ttl_seconds = 300
# path = "/home/you/.cache/submon/cache.json"

[notify]
# 状态栏染色阈值(剩余百分比):低于 warn 变黄、低于 crit 变红。
warn_below_pct = 20.0
crit_below_pct = 5.0

# 催用提醒:窗口将在该时长内重置、且剩余 ≥ use_above_pct 时,
# 推送「配额即将重置,抓紧使用」。设为 0 关闭。
# 例:"1h" = 重置前 1 小时提醒;"30m" = 前 30 分钟。
remind_before = "1h"
# 剩余低于此百分比则认为"已用够本",重置时不打扰。
use_above_pct = 30.0

[notify.gotify]
url = "https://gotify.example.com"
app_token = "Axxxxxxxxxxxx"  # 建议用 `submon token set gotify.app_token` 加密存储
# 1-10,默认 5。
priority = 5

[statusline]
# ANTHROPIC_BASE_URL 无法识别时的默认 provider:"zhipu" | "minimax"。
default_provider = "zhipu"
# 排版方案:a|b|c,详见 README。也可用环境变量 SUBMON_LAYOUT 临时切换。
#   a = ➜ dir git:(main)✗ Model [ctx] 5h 72% left·1h9m weekly 74% left (↻2m)
#   b = Model · ctx 15% used · dir · ⎇main · 5h 72% left (1h9m) · weekly 74% left (5d10h)
#   c = dir main · 15% · 72%/74% (↻2m)
layout = "a"
